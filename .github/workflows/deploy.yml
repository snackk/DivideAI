name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Firebase Config
        env:
          CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          echo "$CONFIG" > firebase-config.json
          sed -i "/__FIREBASE_CONFIG_PLACEHOLDER__/c\\" firebase-config.json index.html
          rm firebase-config.json

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
