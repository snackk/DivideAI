<!DOCTYPE html>
<html lang="pt-PT" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="logo.png">
    <title>DivideAi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --md-sys-color-primary: #d0bcff;
            --md-sys-color-on-primary: #381e72;
            --md-sys-color-surface: #1c1b1f;
            --md-sys-color-surface-container: #2b2930;
            --md-sys-color-outline: #938f99;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--md-sys-color-surface);
            color: #e6e1e5;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            user-select: none;
        }

        .safe-area-bottom { padding-bottom: calc(env(safe-area-inset-bottom) + 10px); }

        /* Estilos Swipe */
        .swipe-container {
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            touch-action: pan-y;
        }

        .swipe-content {
            position: relative;
            z-index: 2;
            transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            background-color: var(--md-sys-color-surface-container);
        }

        .swipe-actions {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            display: flex;
            z-index: 1;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 70px;
            height: 100%;
            color: white;
            font-size: 0.75rem;
            flex-direction: column;
            gap: 4px;
        }

        .btn-settle { background-color: #34c759; } /* iOS Green */
        .btn-edit { background-color: #007aff; }   /* iOS Blue */
        .btn-delete { background-color: #ff3b30; } /* iOS Red */

        .material-card {
            background-color: var(--md-sys-color-surface-container);
            transition: transform 0.2s;
        }

        .view-content { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar { display: none; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="auth-screen" class="fixed inset-0 z-50 bg-[#1c1b1f] flex flex-col items-center justify-center p-6 text-center">
        <div class="mb-8">
            <div class="w-20 h-20 bg-[#d0bcff] rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-wallet text-[#381e72] text-3xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-[#e6e1e5]">DivideAi</h1>
        </div>
        <button id="login-btn" class="w-full max-w-xs bg-white text-black font-medium py-4 rounded-full flex items-center justify-center gap-3">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google">
            <span>Entrar com o Google</span>
        </button>
    </div>

    <div id="app-container" class="hidden flex-col h-screen max-w-md mx-auto w-full relative">
        <header class="p-4 flex items-center justify-between sticky top-0 bg-[#1c1b1f] z-10">
            <h2 id="view-title" class="text-xl font-medium">Atividade</h2>
            <div class="flex gap-4 items-center">
                <button id="search-trigger" class="text-[#938f99]"><i class="fas fa-search text-xl"></i></button>
                <div id="user-header-profile" class="w-8 h-8 rounded-full bg-[#49454f] overflow-hidden border border-[#938f99]" onclick="switchView('account')"></div>
            </div>
        </header>

        <main id="main-content" class="flex-1 overflow-y-auto p-4 space-y-4 pb-24"></main>

        <nav class="fixed bottom-0 left-0 right-0 bg-[#2b2930] border-t border-[#49454f] flex justify-between items-center px-4 safe-area-bottom max-w-md mx-auto z-50 h-20">
            <button onclick="switchView('activity')" class="nav-item flex flex-col items-center flex-1 text-[#d0bcff]">
                <i class="fas fa-clock text-xl mb-1"></i>
                <span class="text-[10px]">Atividade</span>
            </button>
            <button onclick="switchView('friends')" class="nav-item flex flex-col items-center flex-1 text-[#938f99]">
                <i class="fas fa-users text-xl mb-1"></i>
                <span class="text-[10px]">Amigos</span>
            </button>
            <div class="flex-1 flex justify-center items-center -mt-8">
                <button id="open-contextual-modal" class="w-14 h-14 bg-[#d0bcff] rounded-2xl flex items-center justify-center text-[#381e72] shadow-2xl border-4 border-[#1c1b1f]">
                    <i class="fas fa-plus text-2xl"></i>
                </button>
            </div>
            <button onclick="switchView('groups')" class="nav-item flex flex-col items-center flex-1 text-[#938f99]">
                <i class="fas fa-layer-group text-xl mb-1"></i>
                <span class="text-[10px]">Grupos</span>
            </button>
            <button onclick="switchView('account')" class="nav-item flex flex-col items-center flex-1 text-[#938f99]">
                <i class="fas fa-user-circle text-xl mb-1"></i>
                <span class="text-[10px]">Conta</span>
            </button>
        </nav>
    </div>

    <div id="expense-modal" class="fixed inset-0 z-[60] bg-black/60 hidden flex items-end justify-center">
        <div class="bg-[#2b2930] w-full max-w-md rounded-t-3xl p-6">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modal-title" class="text-xl font-bold">Nova Despesa</h3>
                <button onclick="document.getElementById('expense-modal').classList.add('hidden')" class="p-2"><i class="fas fa-times"></i></button>
            </div>
            <form id="expense-form" class="space-y-4">
                <input type="hidden" id="exp-id">
                <input type="text" id="exp-desc" required placeholder="Descrição" class="w-full bg-[#1c1b1f] p-3 rounded-lg outline-none">
                <input type="number" step="0.01" id="exp-amount" required placeholder="0.00" class="w-full bg-[#1c1b1f] p-3 rounded-lg outline-none">
                <input type="date" id="exp-date" required class="w-full bg-[#1c1b1f] p-3 rounded-lg outline-none">
                <select id="exp-friend" required class="w-full bg-[#1c1b1f] p-3 rounded-lg outline-none"></select>
                <div class="grid grid-cols-2 gap-2">
                    <select id="exp-paid-by" class="bg-[#1c1b1f] p-3 rounded-lg outline-none">
                        <option value="me">Eu paguei</option>
                        <option value="friend">Amigo pagou</option>
                    </select>
                    <select id="exp-split-type" class="bg-[#1c1b1f] p-3 rounded-lg outline-none">
                        <option value="equal">50/50</option>
                        <option value="full">100%</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-[#d0bcff] text-[#381e72] font-bold py-4 rounded-full">Guardar</button>
            </form>
        </div>
    </div>

    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-[#49454f] text-white px-6 py-3 rounded-full text-sm opacity-0 transition-opacity z-[100] pointer-events-none"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, addDoc, onSnapshot, updateDoc, deleteDoc, query, where, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB9lbE5DfWqQOOw9oR2UEyWO1K6ntuNCWI",
            authDomain: "test-5d868.firebaseapp.com",
            projectId: "test-5d868",
            storageBucket: "test-5d868.firebasestorage.app",
            messagingSenderId: "980585676684",
            appId: "1:980585676684:web:07702697c10b5fe319a0a9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();
        const appId = "DivideAI";

        let currentUser = null;
        let expenses = [];
        let friends = [];
        let currentView = 'activity';

        // --- SWIPE LOGIC ---
        let touchStartX = 0;
        let currentSwipeEl = null;

        window.handleTouchStart = (e) => {
            touchStartX = e.touches[0].clientX;
            currentSwipeEl = e.currentTarget.querySelector('.swipe-content');
            currentSwipeEl.style.transition = 'none';
        };

        window.handleTouchMove = (e) => {
            if (!currentSwipeEl) return;
            let moveX = e.touches[0].clientX - touchStartX;
            if (moveX > 0) moveX = 0; // Impedir swipe para a direita
            if (moveX < -160) moveX = -160; // Limite máximo
            currentSwipeEl.style.transform = `translateX(${moveX}px)`;
        };

        window.handleTouchEnd = (e) => {
            if (!currentSwipeEl) return;
            currentSwipeEl.style.transition = 'transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28)';
            const finalMove = e.changedTouches[0].clientX - touchStartX;
            
            if (finalMove < -80) {
                const max = currentSwipeEl.parentElement.dataset.type === 'user' ? -70 : -140;
                currentSwipeEl.style.transform = `translateX(${max}px)`;
            } else {
                currentSwipeEl.style.transform = `translateX(0px)`;
            }
        };

        // Resetar swipes ao clicar fora
        document.addEventListener('touchstart', (e) => {
            if (!e.target.closest('.swipe-container')) {
                document.querySelectorAll('.swipe-content').forEach(el => el.style.transform = 'translateX(0px)');
            }
        }, {passive: true});

        // --- FIREBASE ACTIONS ---
        window.settleDebts = async (friendEmail) => {
            if (!confirm(`Marcar todas as despesas com ${friendEmail} como liquidadas?`)) return;
            const toDelete = expenses.filter(e => e.involvedUsers.includes(friendEmail));
            const batch = writeBatch(db);
            toDelete.forEach(exp => {
                batch.delete(doc(db, 'artifacts', appId, 'shared_expenses', exp.id));
            });
            await batch.commit();
            showToast("Tudo liquidado!");
        };

        window.deleteExpense = async (id) => {
            if (!confirm("Remover esta despesa?")) return;
            await deleteDoc(doc(db, 'artifacts', appId, 'shared_expenses', id));
            showToast("Despesa removida.");
        };

        // --- RENDER ---
        const renderActivity = () => {
            const main = document.getElementById('main-content');
            if (expenses.length === 0) {
                main.innerHTML = `<div class="p-12 text-center opacity-40">Sem atividade recente.</div>`;
                return;
            }

            const grouped = expenses.reduce((acc, exp) => {
                const friendEmail = exp.involvedUsers.find(u => u !== currentUser.email);
                if (!acc[friendEmail]) acc[friendEmail] = [];
                acc[friendEmail].push(exp);
                return acc;
            }, {});

            let html = '<div class="space-y-4">';
            Object.keys(grouped).forEach(friendEmail => {
                const friendExp = grouped[friendEmail];
                const balance = friendExp.reduce((sum, e) => {
                    const amt = (e.splitType === 'equal') ? e.amount / 2 : e.amount;
                    return sum + (e.paidByEmail === currentUser.email ? amt : -amt);
                }, 0);

                const safeId = friendEmail.replace(/\./g, '_');

                html += `
                    <div class="swipe-container" data-type="user">
                        <div class="swipe-actions">
                            <button onclick="settleDebts('${friendEmail}')" class="action-btn btn-settle">
                                <i class="fas fa-check-double"></i><span>Settle</span>
                            </button>
                        </div>
                        <div class="swipe-content p-4 flex items-center gap-3 cursor-pointer" 
                             ontouchstart="handleTouchStart(event)" ontouchmove="handleTouchMove(event)" ontouchend="handleTouchEnd(event)"
                             onclick="toggleGroup('${safeId}')">
                            <div class="w-10 h-10 rounded-full bg-[#49454f] flex items-center justify-center">
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="flex-1">
                                <h4 class="font-bold text-sm">${friendEmail.split('@')[0]}</h4>
                                <p class="text-[10px] text-[#938f99]">${friendExp.length} itens</p>
                            </div>
                            <div class="text-right">
                                <p class="text-xs font-bold ${balance >= 0 ? 'text-green-400' : 'text-orange-400'}">
                                    ${balance.toFixed(2)}€
                                </p>
                            </div>
                        </div>
                    </div>
                    <div id="group-${safeId}" class="hidden space-y-2 ml-4 border-l-2 border-[#49454f] pl-2">
                        ${friendExp.map(exp => {
                            const iPaid = exp.paidByEmail === currentUser.email;
                            const displayAmt = (exp.splitType === 'equal') ? exp.amount / 2 : exp.amount;
                            return `
                                <div class="swipe-container" data-type="expense">
                                    <div class="swipe-actions">
                                        <button onclick="editExpense('${exp.id}')" class="action-btn btn-edit">
                                            <i class="fas fa-pen"></i><span>Editar</span>
                                        </button>
                                        <button onclick="deleteExpense('${exp.id}')" class="action-btn btn-delete">
                                            <i class="fas fa-trash"></i><span>Remover</span>
                                        </button>
                                    </div>
                                    <div class="swipe-content p-3 flex items-center gap-4 bg-[#1c1b1f]" 
                                         ontouchstart="handleTouchStart(event)" ontouchmove="handleTouchMove(event)" ontouchend="handleTouchEnd(event)">
                                        <div class="flex-1">
                                            <h5 class="text-xs font-medium">${exp.description}</h5>
                                            <p class="text-[8px] text-[#938f99]">${exp.date}</p>
                                        </div>
                                        <div class="text-right">
                                            <p class="text-[#d0bcff] font-bold text-xs">${exp.amount.toFixed(2)}€</p>
                                            <p class="text-[8px] ${iPaid ? 'text-green-400' : 'text-orange-400'}">
                                                ${iPaid ? 'Recebes' : 'Deves'} ${displayAmt.toFixed(2)}€
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            });
            main.innerHTML = html + '</div>';
        };

        // --- BOOTSTRAP & CORE (Resto do teu código original adaptado) ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                setupDataSync();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
            }
        });

        document.getElementById('login-btn').onclick = () => signInWithPopup(auth, googleProvider);

        function setupDataSync() {
            const q = query(collection(db, 'artifacts', appId, 'shared_expenses'), where("involvedUsers", "array-contains", currentUser.email));
            onSnapshot(q, (snap) => {
                expenses = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderActivity();
            });
            // Sync friends
            onSnapshot(collection(db, 'artifacts', appId, 'users', currentUser.uid, 'friends'), snap => {
                friends = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                const select = document.getElementById('exp-friend');
                select.innerHTML = friends.map(f => `<option value="${f.email}">${f.displayName}</option>`).join('');
            });
        }

        window.switchView = (v) => {
            currentView = v;
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.replace('text-[#d0bcff]', 'text-[#938f99]'));
            if(v === 'activity') renderActivity();
            else document.getElementById('main-content').innerHTML = `<div class="p-12 text-center opacity-40">${v} em breve</div>`;
        };

        window.toggleGroup = (id) => {
            const el = document.getElementById(`group-${id}`);
            el.classList.toggle('hidden');
        };

        window.editExpense = (id) => {
            const exp = expenses.find(e => e.id === id);
            if (!exp) return;
            document.getElementById('exp-id').value = exp.id;
            document.getElementById('exp-desc').value = exp.description;
            document.getElementById('exp-amount').value = exp.amount;
            document.getElementById('exp-date').value = exp.date;
            document.getElementById('exp-friend').value = exp.involvedUsers.find(u => u !== currentUser.email);
            document.getElementById('expense-modal').classList.remove('hidden');
        };

        document.getElementById('expense-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('exp-id').value;
            const friendEmail = document.getElementById('exp-friend').value;
            const data = {
                description: document.getElementById('exp-desc').value,
                amount: parseFloat(document.getElementById('exp-amount').value),
                date: document.getElementById('exp-date').value,
                paidByEmail: document.getElementById('exp-paid-by').value === 'me' ? currentUser.email : friendEmail,
                splitType: document.getElementById('exp-split-type').value,
                involvedUsers: [currentUser.email, friendEmail],
                timestamp: Date.now()
            };
            if (id) await updateDoc(doc(db, 'artifacts', appId, 'shared_expenses', id), data);
            else await addDoc(collection(db, 'artifacts', appId, 'shared_expenses'), data);
            document.getElementById('expense-modal').classList.add('hidden');
            showToast("Guardado!");
        };

        document.getElementById('open-contextual-modal').onclick = () => {
            document.getElementById('expense-form').reset();
            document.getElementById('exp-id').value = "";
            document.getElementById('expense-modal').classList.remove('hidden');
        };

        function showToast(m) {
            const t = document.getElementById('toast');
            t.textContent = m;
            t.classList.remove('opacity-0');
            setTimeout(() => t.classList.add('opacity-0'), 2000);
        }

    </script>
</body>
</html>
