<!DOCTYPE html>
<html lang="pt-PT" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dividir Contas - Material Dark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --md-sys-color-primary: #d0bcff;
            --md-sys-color-on-primary: #381e72;
            --md-sys-color-surface: #1c1b1f;
            --md-sys-color-surface-container: #2b2930;
            --md-sys-color-outline: #938f99;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--md-sys-color-surface);
            color: #e6e1e5;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }

        .material-card {
            background-color: var(--md-sys-color-surface-container);
            border-radius: 16px;
            transition: transform 0.2s;
        }

        .material-card:active { transform: scale(0.98); }

        .view-content {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar { display: none; }

        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="auth-screen" class="fixed inset-0 z-50 bg-[#1c1b1f] flex flex-col items-center justify-center p-6 text-center">
        <div class="mb-8">
            <div class="w-20 h-20 bg-[#d0bcff] rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-wallet text-[#381e72] text-3xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-[#e6e1e5]">Dividir Contas</h1>
            <p class="text-[#938f99] mt-2">Gere despesas partilhadas em tempo real</p>
        </div>
        
        <div id="auth-loading" class="hidden mb-4">
            <div class="inline-block w-8 h-8 border-4 border-[#d0bcff] border-t-transparent rounded-full animate-spin"></div>
            <p class="text-sm mt-2 text-[#938f99]">A autenticar...</p>
        </div>

        <button id="login-btn" class="w-full max-w-xs bg-white text-black font-medium py-4 rounded-full flex items-center justify-center gap-3 transition-all hover:bg-gray-100 shadow-lg">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" alt="Google">
            <span>Entrar com o Google</span>
        </button>
    </div>

    <div id="app-container" class="hidden flex-col h-screen max-w-md mx-auto w-full relative">
        
        <header class="p-4 flex items-center justify-between sticky top-0 bg-[#1c1b1f] z-10">
            <h2 id="view-title" class="text-xl font-medium">Atividade</h2>
            <div class="flex gap-4 items-center flex-1 justify-end">
                <div id="search-container" class="flex items-center bg-[#2b2930] rounded-full px-3 py-1 hidden w-full max-w-[180px]">
                    <input type="text" id="search-input" placeholder="Procurar..." 
                           class="bg-transparent border-none outline-none text-xs w-full text-[#e6e1e5] placeholder-[#938f99]">
                    <button onclick="closeSearch()"><i class="fas fa-times text-[#938f99] text-xs"></i></button>
                </div>
                <button id="search-trigger" class="text-[#938f99]"><i class="fas fa-search text-xl"></i></button>
                
                <div id="user-header-profile" class="w-8 h-8 rounded-full bg-[#49454f] overflow-hidden border border-[#938f99] cursor-pointer" onclick="switchView('account')">
                    <i class="fas fa-user text-xs flex items-center justify-center h-full"></i>
                </div>
            </div>
        </header>

        <main id="main-content" class="flex-1 overflow-y-auto p-4 space-y-4 pb-24"></main>

        <nav class="fixed bottom-0 left-0 right-0 bg-[#2b2930] border-t border-[#49454f] flex justify-between items-center px-2 py-2 safe-area-bottom max-w-md mx-auto z-50 h-16">
            <button onclick="switchView('activity')" class="nav-item flex flex-col items-center p-2 text-[#d0bcff] flex-1">
                <i class="fas fa-clock text-xl mb-1"></i>
                <span class="text-[10px]">Atividade</span>
            </button>
            <button onclick="switchView('friends')" class="nav-item flex flex-col items-center p-2 text-[#938f99] flex-1">
                <i class="fas fa-users text-xl mb-1"></i>
                <span class="text-[10px]">Amigos</span>
            </button>
            <div class="flex-1 flex justify-center items-center">
                <button id="open-contextual-modal" class="w-12 h-12 bg-[#d0bcff] rounded-2xl flex items-center justify-center text-[#381e72] shadow-lg">
                    <i class="fas fa-plus text-xl"></i>
                </button>
            </div>
            <button onclick="switchView('groups')" class="nav-item flex flex-col items-center p-2 text-[#938f99] flex-1">
                <i class="fas fa-layer-group text-xl mb-1"></i>
                <span class="text-[10px]">Grupos</span>
            </button>
            <button onclick="switchView('account')" class="nav-item flex flex-col items-center p-2 text-[#938f99] flex-1">
                <i class="fas fa-user-circle text-xl mb-1"></i>
                <span class="text-[10px]">Conta</span>
            </button>
        </nav>
    </div>

    <div id="expense-modal" class="fixed inset-0 z-[60] bg-black/60 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-[#2b2930] w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 view-content">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modal-title" class="text-xl font-bold">Nova Despesa</h3>
                <button id="close-expense-modal" class="text-[#938f99] p-2"><i class="fas fa-times"></i></button>
            </div>
            <form id="expense-form" class="space-y-4">
                <input type="hidden" id="exp-id">
                <input type="text" id="exp-desc" required placeholder="Descrição" class="w-full bg-[#1c1b1f] border-b border-[#49454f] p-3 focus:border-[#d0bcff] outline-none rounded-t-lg">
                <div class="flex gap-4">
                    <input type="number" step="0.01" id="exp-amount" required placeholder="Valor (€)" class="flex-1 bg-[#1c1b1f] border-b border-[#49454f] p-3 outline-none">
                    <input type="date" id="exp-date" required class="flex-1 bg-[#1c1b1f] border-b border-[#49454f] p-3 outline-none">
                </div>
                <select id="exp-friend" required class="w-full bg-[#1c1b1f] border-b border-[#49454f] p-3 outline-none"></select>
                <div class="grid grid-cols-2 gap-4">
                    <select id="exp-paid-by" class="w-full bg-[#1c1b1f] border-b border-[#49454f] p-3 outline-none">
                        <option value="me">Pago por mim</option>
                        <option value="friend">Pago pelo amigo</option>
                    </select>
                    <select id="exp-split-type" class="w-full bg-[#1c1b1f] border-b border-[#49454f] p-3 outline-none">
                        <option value="equal">Dividir 50/50</option>
                        <option value="full">Total 100%</option>
                    </select>
                </div>
                <div id="split-info" class="bg-[#1c1b1f] p-4 rounded-xl text-sm text-[#938f99] italic"></div>
                <button type="submit" id="submit-btn" class="w-full bg-[#d0bcff] text-[#381e72] font-bold py-4 rounded-full mt-6">Guardar</button>
            </form>
        </div>
    </div>

    <div id="friend-modal" class="fixed inset-0 z-[60] bg-black/60 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-[#2b2930] w-full max-w-md rounded-t-3xl sm:rounded-3xl p-6 view-content">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold">Adicionar Amigo</h3>
                <button id="close-friend-modal" class="text-[#938f99] p-2"><i class="fas fa-times"></i></button>
            </div>
            <form id="friend-form" class="space-y-4">
                <input type="email" id="add-friend-email" required placeholder="E-mail do Google" class="w-full bg-[#1c1b1f] border-b border-[#49454f] p-3 outline-none rounded-t-lg">
                <input type="text" id="add-friend-custom-name" placeholder="Nome (Opcional)" class="w-full bg-[#1c1b1f] border-b border-[#49454f] p-3 outline-none">
                <button type="submit" class="w-full bg-[#d0bcff] text-[#381e72] font-bold py-4 rounded-full mt-6 uppercase text-xs">Adicionar</button>
            </form>
        </div>
    </div>

    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-[#49454f] text-white px-6 py-3 rounded-full text-sm shadow-2xl transition-opacity opacity-0 pointer-events-none z-[100]"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, addDoc, onSnapshot, updateDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- CONFIG & STATE ---
        const firebaseConfig = {
            apiKey: "AIzaSyB9lbE5DfWqQOOw9oR2UEyWO1K6ntuNCWI",
            authDomain: "test-5d868.firebaseapp.com",
            projectId: "test-5d868",
            storageBucket: "test-5d868.firebasestorage.app",
            messagingSenderId: "980585676684",
            appId: "1:980585676684:web:07702697c10b5fe319a0a9"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();
        const appId = "DivideAI";

        let currentUser = null;
        let expenses = [];
        let friends = [];
        let currentView = 'activity';
        let searchTerm = "";

        const i18n = {
            pt: {
                youPaid: "Tu pagaste", friendPaid: " pagou", youReceive: "Recebes", youOwe: "Deves",
                settleUp: "Liquidar", confirmSettle: "Confirmas a liquidação de todas as despesas com este amigo?",
                toastSettled: "Contas liquidadas!", splitMeEqual: "Tu pagas e o amigo deve metade.",
                splitMeFull: "Tu pagas e o amigo deve tudo.", splitFriendEqual: "Amigo paga e deves metade.",
                splitFriendFull: "Amigo paga e deves tudo."
            }
        };
        const t = (k) => i18n.pt[k] || k;

        // --- UI ELEMENTS ---
        const mainContent = document.getElementById('main-content');
        const viewTitle = document.getElementById('view-title');
        const searchInput = document.getElementById('search-input');

        // --- AUTH ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'profiles', user.email.replace(/\./g, '_')), {
                    uid: user.uid, email: user.email, displayName: user.displayName, photoURL: user.photoURL, updatedAt: Date.now()
                }, { merge: true });
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                if (user.photoURL) document.getElementById('user-header-profile').innerHTML = `<img src="${user.photoURL}" class="w-full h-full object-cover">`;
                setupDataSync();
            } else {
                document.getElementById('auth-screen').classList.remove('hidden');
                document.getElementById('app-container').classList.add('hidden');
            }
        });

        document.getElementById('login-btn').onclick = () => signInWithPopup(auth, googleProvider);

        // --- DATA SYNC ---
        function setupDataSync() {
            onSnapshot(collection(db, 'artifacts', appId, 'users', currentUser.uid, 'friends'), (snap) => {
                friends = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                const select = document.getElementById('exp-friend');
                select.innerHTML = '<option value="">Com quem?</option>' + friends.map(f => `<option value="${f.email}">${f.displayName}</option>`).join('');
                refreshCurrentView();
            });

            const q = query(collection(db, 'artifacts', appId, 'shared_expenses'), where("involvedUsers", "array-contains", currentUser.email));
            onSnapshot(q, (snap) => {
                expenses = snap.docs.map(d => {
                    const data = d.data();
                    return { id: d.id, ...data, friendId: data.creatorEmail === currentUser.email ? data.friendEmail : data.creatorEmail };
                }).sort((a,b) => b.timestamp - a.timestamp);
                refreshCurrentView();
            });
        }

        // --- VIEWS ---
        window.switchView = (v) => {
            currentView = v;
            document.querySelectorAll('.nav-item').forEach((btn, i) => {
                const active = ['activity', 'friends', 'groups', 'account'][i] === v;
                btn.classList.toggle('text-[#d0bcff]', active);
                btn.classList.toggle('text-[#938f99]', !active);
            });
            if (v === 'activity') renderActivity();
            else if (v === 'friends') renderFriends();
            else mainContent.innerHTML = `<div class="p-12 text-center opacity-40 uppercase text-xs">${v} em breve</div>`;
        };

        const renderActivity = () => {
            viewTitle.textContent = "Atividade";
            const filtered = expenses.filter(e => e.description.toLowerCase().includes(searchTerm) || e.friendId.includes(searchTerm));
            
            if (!filtered.length) {
                mainContent.innerHTML = `<div class="p-12 text-center opacity-30"><i class="fas fa-search text-4xl mb-2"></i><p>Nada encontrado</p></div>`;
                return;
            }

            const grouped = filtered.reduce((acc, e) => {
                if (!acc[e.friendId]) acc[e.friendId] = [];
                acc[e.friendId].push(e);
                return acc;
            }, {});

            mainContent.innerHTML = Object.keys(grouped).map(email => {
                const fExp = grouped[email];
                const fInfo = friends.find(f => f.email === email) || { displayName: email.split('@')[0] };
                const balance = fExp.reduce((s, e) => {
                    const amt = e.splitType === 'equal' ? e.amount/2 : e.amount;
                    return s + (e.paidByEmail === currentUser.email ? amt : -amt);
                }, 0);
                const sId = email.replace(/\./g, '_');

                return `
                    <div class="space-y-2">
                        <div class="flex gap-2">
                            <div onclick="toggleGroup('${sId}')" class="flex-1 flex items-center gap-3 p-3 bg-[#2b2930] rounded-2xl cursor-pointer">
                                <div class="w-10 h-10 rounded-full bg-[#49454f] flex items-center justify-center overflow-hidden">
                                    ${fInfo.photoURL ? `<img src="${fInfo.photoURL}" class="w-full h-full object-cover">` : `<i class="fas fa-user text-xs"></i>`}
                                </div>
                                <div class="flex-1">
                                    <h4 class="font-bold text-sm">${fInfo.displayName}</h4>
                                    <p class="text-[10px] text-[#938f99]">${fExp.length} despesas</p>
                                </div>
                                <div class="text-right mr-2">
                                    <p class="text-xs font-bold ${balance >= 0 ? 'text-green-400' : 'text-orange-400'}">${balance >= 0 ? '+' : ''}${balance.toFixed(2)}€</p>
                                </div>
                                <i id="icon-${sId}" class="fas fa-chevron-down text-[#938f99] text-[10px] transition-transform"></i>
                            </div>
                            ${Math.abs(balance) > 0.01 ? `<button onclick="settleWithFriend('${email}')" class="bg-green-500/20 text-green-400 px-4 rounded-2xl"><i class="fas fa-check-double"></i></button>` : ''}
                        </div>
                        <div id="group-${sId}" class="hidden space-y-2 ml-4 border-l-2 border-[#49454f] pl-4">
                            ${fExp.map(e => {
                                const iPaid = e.paidByEmail === currentUser.email;
                                const share = e.splitType === 'equal' ? e.amount/2 : e.amount;
                                return `
                                    <div class="material-card p-3 flex items-center gap-4 relative bg-[#1c1b1f]">
                                        <div class="flex-1">
                                            <h5 class="text-xs font-medium">${e.description}</h5>
                                            <p class="text-[9px] text-[#938f99]">${new Date(e.date).toLocaleDateString()}</p>
                                        </div>
                                        <div class="text-right pr-8">
                                            <p class="text-[#d0bcff] font-bold text-xs">${e.amount.toFixed(2)}€</p>
                                            <p class="text-[8px] ${iPaid ? 'text-green-400' : 'text-orange-400'}">${iPaid ? t('youReceive') : t('youOwe')} ${share.toFixed(2)}€</p>
                                        </div>
                                        ${e.creatorEmail === currentUser.email ? `<button onclick="event.stopPropagation(); editExp('${e.id}')" class="absolute right-2 p-2 text-[#938f99]"><i class="fas fa-pen text-[9px]"></i></button>` : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        };

        const renderFriends = () => {
            viewTitle.textContent = "Amigos";
            mainContent.innerHTML = `<div class="space-y-2">${friends.map(f => `
                <div class="material-card p-4 flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-[#49454f] flex items-center justify-center overflow-hidden">
                        ${f.photoURL ? `<img src="${f.photoURL}">` : `<i class="fas fa-user"></i>`}
                    </div>
                    <div>
                        <h4 class="font-medium text-sm">${f.displayName}</h4>
                        <p class="text-[10px] text-[#938f99]">${f.email}</p>
                    </div>
                </div>
            `).join('')}</div>`;
        };

        // --- ACTIONS ---
        window.settleWithFriend = async (email) => {
            if (!confirm(t('confirmSettle'))) return;
            const toDel = expenses.filter(e => e.involvedUsers.includes(email));
            await Promise.all(toDel.map(e => deleteDoc(doc(db, 'artifacts', appId, 'shared_expenses', e.id))));
            showToast(t('toastSettled'));
        };

        window.toggleGroup = (id) => {
            const el = document.getElementById(`group-${id}`);
            const icon = document.getElementById(`icon-${id}`);
            el.classList.toggle('hidden');
            icon.style.transform = el.classList.contains('hidden') ? 'rotate(0deg)' : 'rotate(180deg)';
        };

        document.getElementById('expense-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('exp-id').value;
            const friendEmail = document.getElementById('exp-friend').value;
            const data = {
                description: document.getElementById('exp-desc').value,
                amount: parseFloat(document.getElementById('exp-amount').value),
                date: document.getElementById('exp-date').value,
                creatorEmail: currentUser.email,
                friendEmail: friendEmail,
                paidByEmail: document.getElementById('exp-paid-by').value === 'me' ? currentUser.email : friendEmail,
                splitType: document.getElementById('exp-split-type').value,
                timestamp: Date.now(),
                involvedUsers: [currentUser.email, friendEmail]
            };
            const col = collection(db, 'artifacts', appId, 'shared_expenses');
            id ? await updateDoc(doc(db, 'artifacts', appId, 'shared_expenses', id), data) : await addDoc(col, data);
            document.getElementById('expense-modal').classList.add('hidden');
            showToast("Concluído!");
        };

        document.getElementById('friend-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('add-friend-email').value.trim().toLowerCase();
            const name = document.getElementById('add-friend-custom-name').value.trim();
            const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'profiles', email.replace(/\./g, '_')));
            const fData = snap.exists() ? snap.data() : { displayName: name || email.split('@')[0], photoURL: null };
            await addDoc(collection(db, 'artifacts', appId, 'users', currentUser.uid, 'friends'), { email, ...fData, addedAt: Date.now() });
            document.getElementById('friend-modal').classList.add('hidden');
            showToast("Amigo adicionado!");
        };

        // --- SEARCH & UI HELPERS ---
        window.closeSearch = () => { searchTerm = ""; searchInput.value = ""; document.getElementById('search-container').classList.add('hidden'); document.getElementById('search-trigger').classList.remove('hidden'); refreshCurrentView(); };
        document.getElementById('search-trigger').onclick = () => { document.getElementById('search-trigger').classList.add('hidden'); document.getElementById('search-container').classList.remove('hidden'); searchInput.focus(); };
        searchInput.oninput = (e) => { searchTerm = e.target.value.toLowerCase(); refreshCurrentView(); };
        document.getElementById('open-contextual-modal').onclick = () => {
            if(currentView === 'friends') document.getElementById('friend-modal').classList.remove('hidden');
            else { document.getElementById('expense-form').reset(); document.getElementById('exp-id').value = ""; document.getElementById('expense-modal').classList.remove('hidden'); }
        };
        document.getElementById('close-expense-modal').onclick = () => document.getElementById('expense-modal').classList.add('hidden');
        document.getElementById('close-friend-modal').onclick = () => document.getElementById('friend-modal').classList.add('hidden');

        function refreshCurrentView() { switchView(currentView); }
        function showToast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.remove('opacity-0'); setTimeout(() => t.classList.add('opacity-0'), 2000); }
        window.editExp = (id) => {
            const e = expenses.find(x => x.id === id);
            document.getElementById('exp-id').value = e.id;
            document.getElementById('exp-desc').value = e.description;
            document.getElementById('exp-amount').value = e.amount;
            document.getElementById('exp-date').value = e.date;
            document.getElementById('exp-friend').value = e.friendId;
            document.getElementById('expense-modal').classList.remove('hidden');
        };
    </script>
</body>
</html>
